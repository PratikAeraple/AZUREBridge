<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">AZUREBridge hybrid cloud reference architecture</title><desc id="desc">A designed private hybrid topology connecting a local lab over a planned VPN to an Azure VNet with management and workload subnets. Azure identity and monitoring are optional and not deployed.</desc><defs><linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a8994"/><stop offset="1" stop-color="#075c68"/></linearGradient><style>.label{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.edge{stroke:#607c88;stroke-width:2;fill:none}.dash{stroke-dasharray:7 7}</style></defs><rect x="18" y="30" width="684" height="280" rx="24" fill="#f3f8f8" stroke="#d6e8e8"/><rect x="42" y="106" width="146" height="106" rx="16" fill="#fff" stroke="#d6e8e8"/><text class="label" x="115" y="140" text-anchor="middle" fill="#122035">LOCAL LAB</text><text class="small" x="115" y="164" text-anchor="middle" fill="#4d6075">private services</text><text class="small" x="115" y="185" text-anchor="middle" fill="#4d6075">not connected</text><path class="edge dash" d="M188 160h50"/><rect x="238" y="126" width="118" height="68" rx="16" fill="#fff4df" stroke="#f1dfb9"/><text class="label" x="297" y="154" text-anchor="middle" fill="#775119">IPsec VPN</text><text class="small" x="297" y="176" text-anchor="middle" fill="#775119">planned</text><path class="edge dash" d="M356 160h44"/><rect x="400" y="62" width="266" height="212" rx="22" fill="url(#cloud)"/><text class="label" x="533" y="91" text-anchor="middle" fill="#fff">AZURE VNET · DESIGNED</text><rect x="424" y="112" width="102" height="96" rx="14" fill="#fff"/><text class="small" x="475" y="143" text-anchor="middle" fill="#122035">Management</text><text class="small" x="475" y="166" text-anchor="middle" fill="#4d6075">subnet</text><rect x="540" y="112" width="102" height="96" rx="14" fill="#fff"/><text class="small" x="591" y="143" text-anchor="middle" fill="#122035">Workload</text><text class="small" x="591" y="166" text-anchor="middle" fill="#4d6075">private NSG</text><text class="small" x="533" y="238" text-anchor="middle" fill="#fff">Managed identity · optional monitoring</text><text class="small" x="42" y="290" fill="#4d6075">Terraform resources default off · no Azure deployment claimed</text></svg>
